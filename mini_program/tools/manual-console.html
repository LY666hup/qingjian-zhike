<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青健智课 · 人工计数联调台</title>
<style>body{margin:0;background:#f1f7f3;color:#183f31;font:16px system-ui}main{max-width:1100px;margin:32px auto;padding:20px}h1{margin-bottom:6px}.notice{background:#e0f0e5;padding:16px;border-radius:16px;margin:16px 0}.panel{background:white;padding:22px;border-radius:20px;margin:16px 0}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}button{background:#1e6849;color:white;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.4;cursor:default}input,select{padding:10px;border:1px solid #c4d8cd;border-radius:9px;font:inherit}#students{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.student{background:#fff;padding:22px;border-radius:20px}.count{font-size:52px;font-weight:750}.muted{color:#7b9284;font-size:14px}#error{color:#a34b34;min-height:25px}#roster{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}.audit{font-size:13px;line-height:1.8}label{cursor:pointer}</style>
<main><h1>人工计数联调台</h1><div class="muted">后台窗口点击加数 → 小程序教练课堂同步变化</div><div class="notice">测试服务连接 · 模拟运动输入。没有连接FPGA / RK，相机与算法未运行。学生报告仅在“结束并归档”后发布。</div><div id="error"></div>
<section class="panel"><div class="row"><b id="stage">连接中</b><select id="action"><option value="squat">深蹲</option><option value="jumping_jack">开合跳</option><option value="pushup">俯卧撑</option></select><label>目标 <input id="target" type="number" value="15" min="1" max="999" style="width:70px"></label><button id="prepare">使用所选名单新建一轮</button></div><div id="roster"></div></section>
<section class="panel row"><button id="start">开始 / 继续</button><button id="pause">暂停</button><button id="finish">结束并归档</button><span id="connection" class="muted"></span></section><div id="students"></div><section class="panel"><h3>操作与修正记录</h3><div id="audit" class="audit"></div></section></main>
<script>
let token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let snapshot,busy=false;const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Test-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.message||'连接失败');return data.data;}
async function command(command,extra={}){if(busy)return;busy=true;try{snapshot=await request('/test/command',{command,round:snapshot.classroom.round,command_id:crypto.randomUUID(),...extra});$('error').textContent='';render();}catch(e){$('error').textContent=e.message;}finally{busy=false;}}
function render(){const c=snapshot.classroom;$('stage').textContent='第'+c.round+'轮 · '+c.action_name+' · '+({ready:'待开始',running:'训练进行中',paused:'已暂停',finished:'已归档'})[c.stage];$('connection').textContent='本地测试服务已连接 · 不自动加数';$('prepare').disabled=!['ready','finished'].includes(c.stage);$('start').disabled=!['ready','paused'].includes(c.stage);$('pause').disabled=c.stage!=='running';$('finish').disabled=!['running','paused'].includes(c.stage);
if(!$('roster').children.length)$('roster').innerHTML=snapshot.roster.map(s=>'<label><input type="checkbox" value="'+s.student_id+'" '+(snapshot.students.some(x=>x.student_id===s.student_id)?'checked':'')+'>'+escape(s.name)+'</label>').join('');
$('students').innerHTML=snapshot.students.map(s=>'<div class="student"><b>'+escape(s.name)+'</b><div class="count">'+s.reps+'<small class="muted"> / '+s.target_reps+'</small></div><div class="muted">模拟输入 '+s.raw_reps+' 次 · 教练修正 '+(s.offset>=0?'+':'')+s.offset+'</div><div class="row" style="margin-top:18px"><button data-plus="'+s.student_id+'" '+(c.stage!=='running'?'disabled':'')+'>完成一次 +1</button><button data-correct="'+s.student_id+'" '+(!['running','paused'].includes(c.stage)?'disabled':'')+'>修正次数</button></div></div>').join('');
$('audit').innerHTML=snapshot.audit.slice().reverse().map(a=>escape(a.at)+' · '+escape(a.command)+' '+escape(a.id||'')+(a.before!==undefined?' · '+a.before+' → '+a.after:'')+' '+escape(a.reason)).join('<br>');}
$('prepare').onclick=()=>command('prepare',{ids:[...$('roster').querySelectorAll('input:checked')].map(i=>i.value),action:$('action').value,target:Number($('target').value)});for(const name of ['start','pause','finish'])$(name).onclick=()=>command(name);
$('students').onclick=e=>{const id=e.target.dataset.plus;if(id)return command('increment',{id});const cid=e.target.dataset.correct;if(!cid)return;const s=snapshot.students.find(s=>s.student_id===cid),value=prompt('将 '+s.name+' 的次数改为：',s.reps);if(value===null||!/^\d+$/.test(value))return;const reason=prompt('修正原因（漏计、错计等）：');if(!reason)return;command('correct',{id:cid,value:Number(value),reason,expected_revision:s.count_revision});};
async function poll(){try{if(!busy){if(!token){const r=await fetch('/test/browser-token',{method:'POST',headers:{'Content-Type':'application/json'}});const result=await r.json();if(!r.ok)throw Error('本机窗口授权失败');token=result.data.token;}snapshot=await request('/test/snapshot');render();}}catch(e){$('error').textContent=e.message;$('connection').textContent='连接已断开';}finally{setTimeout(poll,700);}}poll();
</script>
